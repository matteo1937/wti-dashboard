name: Update WTI Data

on:
  schedule:
    # Alle 30 Min während US-Markt (Mo-Fr 13:00-21:00 UTC = 9-17 ET)
    - cron: "*/30 13-21 * * 1-5"
    # 1x abends nach EOD für Backtest
    - cron: "0 23 * * 1-5"
  workflow_dispatch:  # manuell triggerbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest WTI price
        run: python fetch_price.py

      - name: Generate today's signal
        run: python signal_generator.py

      - name: Run backtest (only at 23:00 UTC)
        if: github.event.schedule == '0 23 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python backtest.py

      - name: Commit changes
        run: |
          git config user.name  "wti-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json today_signal.json backtest_results.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "auto: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
