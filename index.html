<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<title>WTI · Live</title>
<link rel="preconnect" href="https://stooq.com">
<style>
  :root{
    --bg:#0a0a0b; --surface:#131316; --surface-2:#1c1c20; --surface-3:#26262c;
    --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.12);
    --text:#f5f5f7; --muted:#86868b; --muted-2:#5a5a5f;
    --green:#30d158; --red:#ff453a; --yellow:#ffd60a; --blue:#0a84ff; --orange:#ff9f0a;
    --grad-up:linear-gradient(135deg,#30d158 0%,#34c759 100%);
    --grad-dn:linear-gradient(135deg,#ff453a 0%,#ff3b30 100%);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 4px 16px rgba(0,0,0,.3);
    --r:14px; --r-lg:20px; --r-sm:8px;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 100px);max-width:520px;margin:0 auto;min-height:100vh}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;width:100%;outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--blue)}
  ::-webkit-scrollbar{display:none}

  /* HEADER */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em}
  .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

  /* HERO PRICE */
  .hero{background:linear-gradient(180deg,var(--surface) 0%,rgba(19,19,22,.6) 100%);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 20px;margin-bottom:14px;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(48,209,88,.06) 0%,transparent 60%);pointer-events:none}
  .hero.down::before{background:radial-gradient(120% 80% at 50% 0%,rgba(255,69,58,.06) 0%,transparent 60%)}
  .hero-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .live-badge{display:flex;align-items:center;gap:5px;color:var(--green);font-size:11px;font-weight:600}
  .live-badge.offline{color:var(--orange)}
  .live-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
  .hero-price{font-size:56px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:6px}
  .hero-change{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
  .hero-change.up{color:var(--green)} .hero-change.down{color:var(--red)}
  .hero-meta{display:flex;gap:20px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
  .hero-meta>div{flex:1}
  .hero-meta .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
  .hero-meta .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

  /* SIGNAL CARD */
  .signal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;position:relative}
  .signal.long{border-color:rgba(48,209,88,.25)}
  .signal.short{border-color:rgba(255,69,58,.25)}
  .signal.no-trade{border-color:var(--border);opacity:.7}
  .signal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .signal-title{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .dir-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px;letter-spacing:.04em}
  .dir-badge.long{background:rgba(48,209,88,.15);color:var(--green)}
  .dir-badge.short{background:rgba(255,69,58,.15);color:var(--red)}
  .dir-badge.none{background:var(--surface-2);color:var(--muted)}
  .conf-pill{padding:5px 10px;border-radius:14px;font-size:11px;font-weight:700;letter-spacing:.05em}
  .conf-pill.high{background:rgba(48,209,88,.15);color:var(--green)}
  .conf-pill.med{background:rgba(255,159,10,.15);color:var(--orange)}
  .conf-pill.low{background:rgba(255,69,58,.15);color:var(--red)}

  .levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .lvl{background:var(--surface-2);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
  .lvl.full{grid-column:1/-1}
  .lvl-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:flex;align-items:center;gap:6px}
  .lvl-lbl .ico{font-size:12px}
  .lvl-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .lvl-sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .lvl.entry{background:linear-gradient(135deg,rgba(10,132,255,.1),rgba(10,132,255,.03));border:1px solid rgba(10,132,255,.2)}
  .lvl.stop .lvl-val{color:var(--red)}
  .lvl.tp .lvl-val{color:var(--green)}

  .reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:5px 10px;font-size:11px;color:var(--muted);font-weight:500}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .1s,opacity .15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
  .btn-success{background:var(--green);color:#000}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

  /* MY TRADE */
  .my-trade{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:14px}
  .mt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .mt-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .mt-pnl{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0 4px}
  .mt-pnl.up{color:var(--green)} .mt-pnl.down{color:var(--red)} .mt-pnl.flat{color:var(--muted)}
  .mt-pnl-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:14px}
  .mt-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
  .mt-grid label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;font-weight:600}
  .mt-grid input,.mt-grid select{padding:10px;font-size:14px;font-variant-numeric:tabular-nums}
  .mt-empty{color:var(--muted);text-align:center;padding:14px 0;font-size:13px}
  .mt-bar{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;padding:10px;background:var(--surface-2);border-radius:10px;font-variant-numeric:tabular-nums}
  .mt-bar span{display:flex;flex-direction:column}
  .mt-bar b{color:var(--text);font-weight:600;font-size:13px;margin-top:2px}

  /* SECTION (collapsible) */
  .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
  .sec-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;user-select:none;transition:background .15s}
  .sec-head:active{background:var(--surface-2)}
  .sec-title{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
  .sec-title .ico{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:14px}
  .sec-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .sec-chev{transition:transform .25s;color:var(--muted);font-size:18px}
  .section.open .sec-chev{transform:rotate(90deg)}
  .sec-body{display:none;padding:0 20px 20px}
  .section.open .sec-body{display:block}

  /* SESSIONS */
  .sessions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
  .sess{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:transform .1s}
  .sess:active{transform:scale(.95)}
  .sess.active{border-color:var(--blue);background:rgba(10,132,255,.1)}
  .sess.complete{border-color:rgba(48,209,88,.3);background:rgba(48,209,88,.05)}
  .sess-ico{font-size:18px;margin-bottom:4px}
  .sess-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .sess.active .sess-lbl{color:var(--blue)}
  .sess.complete .sess-lbl{color:var(--green)}

  .checks{margin-top:10px}
  .check{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;margin-bottom:4px;background:var(--surface-2);cursor:pointer}
  .check input{width:auto;accent-color:var(--blue);margin:0}
  .check span{font-size:13px;flex:1}
  .check.done span{color:var(--muted);text-decoration:line-through}

  /* NEWS */
  .news-item{padding:14px 0;border-bottom:1px solid var(--border)}
  .news-item:last-child{border-bottom:none}
  .news-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:4px}
  .news-title{font-size:14px;font-weight:500;line-height:1.4;flex:1}
  .news-sent{flex-shrink:0;width:8px;height:8px;border-radius:50%;margin-top:6px}
  .news-sent.bullish{background:var(--green)}
  .news-sent.bearish{background:var(--red)}
  .news-sent.neutral{background:var(--muted-2)}
  .news-meta{font-size:11px;color:var(--muted)}
  .sentiment-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:14px 0 8px;position:relative}
  .sent-fill{position:absolute;top:0;height:100%;border-radius:3px;transition:all .3s}
  .sent-fill.up{background:var(--green);left:50%}
  .sent-fill.down{background:var(--red);right:50%}
  .sent-mid{position:absolute;left:50%;top:-3px;width:1px;height:12px;background:var(--border-strong)}
  .sent-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

  /* BACKTEST */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .stat{background:var(--surface-2);border-radius:10px;padding:12px}
  .stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:4px}
  .stat-val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .stat-val.up{color:var(--green)} .stat-val.down{color:var(--red)}
  canvas{width:100%;height:120px;display:block;margin-top:8px}

  /* CHART */
  .tv-wrap{height:340px;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
  .tradingview-widget-container{height:100%}

  /* JOURNAL */
  .journal-empty{text-align:center;color:var(--muted);font-size:13px;padding:14px 0}
  .journal-list{margin-bottom:14px}
  .journal-entry{padding:10px;background:var(--surface-2);border-radius:10px;margin-bottom:6px}
  .journal-entry .je-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .journal-entry .je-text{font-size:13px}
  textarea{resize:none;min-height:80px;font-family:inherit}

  /* FAB / FOOTER */
  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,11,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:10px 16px calc(var(--safe-b) + 10px);z-index:100}
  .nav-inner{display:flex;justify-content:space-around;max-width:520px;margin:0 auto}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;color:var(--muted);font-size:10px;font-weight:600;border-radius:10px;transition:color .15s}
  .nav-btn .ico{font-size:20px}
  .nav-btn.active{color:var(--blue)}

  .toast{position:fixed;bottom:calc(var(--safe-b) + 90px);left:50%;transform:translateX(-50%);background:var(--surface-3);color:var(--text);padding:12px 20px;border-radius:24px;font-size:13px;font-weight:500;box-shadow:var(--shadow);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

  .skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:skel 1.5s infinite;border-radius:8px}
  @keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* RESPONSIVE */
  @media(min-width:600px){
    body{max-width:680px;padding-bottom:24px}
    .nav{display:none}
    body{padding-bottom:24px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    WTI <span style="color:var(--muted);font-weight:400">·</span> <span style="color:var(--muted);font-weight:400">Crude Oil</span>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</div>

<!-- HERO PRICE -->
<div class="hero" id="hero">
  <div class="hero-label">
    <span>USOIL · Spot</span>
    <span class="live-badge" id="liveBadge"><span class="live-dot"></span>LIVE</span>
  </div>
  <div class="hero-price" id="price">$—</div>
  <div class="hero-change" id="priceChange">—</div>
  <div class="hero-meta">
    <div><div class="lbl">High</div><div class="val" id="dayHigh">—</div></div>
    <div><div class="lbl">Low</div><div class="val" id="dayLow">—</div></div>
    <div><div class="lbl">ATR</div><div class="val" id="atr">—</div></div>
  </div>
</div>

<!-- SIGNAL CARD -->
<div class="signal" id="signal">
  <div class="signal-head">
    <div class="signal-title">📊 Tagessignal</div>
    <span class="conf-pill" id="confPill">—</span>
  </div>
  <div id="signalBody">
    <div style="text-align:center;padding:30px 0">
      <div class="dir-badge none" id="dirBadge">⏳ Wird geladen…</div>
    </div>
  </div>
</div>

<!-- MY TRADE -->
<div class="my-trade">
  <div class="mt-head">
    <div class="mt-title">💼 Mein Trade</div>
    <button id="clearTradeBtn" style="font-size:11px;color:var(--muted);font-weight:600">Reset</button>
  </div>
  <div id="myTradeBody">
    <div class="mt-empty">Kein offener Trade — trage unten Entry & Größe ein.</div>
  </div>
  <div class="mt-grid" style="margin-top:14px">
    <div>
      <label>Richtung</label>
      <select id="mtDir"><option value="long">LONG</option><option value="short">SHORT</option></select>
    </div>
    <div>
      <label>Entry $</label>
      <input id="mtEntry" type="number" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
    <div>
      <label>Kontrakte</label>
      <input id="mtQty" type="number" step="1" value="1" inputmode="numeric">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="useSignalBtn">📋 Signal übernehmen</button>
    <button class="btn btn-primary" id="saveTradeBtn">✓ Speichern</button>
  </div>
</div>

<!-- TRADINGVIEW CHART -->
<div class="section open" id="sec-chart">
  <div class="sec-head" data-toggle="sec-chart">
    <div class="sec-title"><span class="ico">📈</span>Chart</div>
    <span class="sec-chev">›</span>
  </div>
  <div class="sec-body">
    <div class="tv-wrap">
      <div class="tradingview-widget-container">
        <div id="tradingview_chart"></div>
      </div>
    </div>
  </div>
</div>

<!-- SESSIONS -->
<div class="section" id="sec-sessions">
  <div class="sec-head" data-toggle="sec-sessions">
    <div class="sec-title"><span class="ico">⏰</span>Trading Sessions</div>
    <span class="sec-meta"><span id="sessionStatus">—</span><span class="sec-chev">›</span></span>
  </div>
  <div class="sec-body">
    <div class="sessions" id="sessionsRow"></div>
    <div id="sessionDetail" style="margin-top:14px"></div>
  </div>
</div>

<!-- KEY LEVELS -->
<div class="section" id="sec-levels">
  <div class="sec-head" data-toggle="sec-levels">
    <div class="sec-title"><span class="ico">🎯</span>Key Levels</div>
    <span class="sec-chev">›</span>
  </div>
  <div class="sec-body">
    <div class="levels" id="keyLevels"></div>
    <div id="biasReason" style="font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px"></div>
  </div>
</div>

<!-- NEWS & SENTIMENT -->
<div class="section" id="sec-news">
  <div class="sec-head" data-toggle="sec-news">
    <div class="sec-title"><span class="ico">📰</span>News & Sentiment</div>
    <span class="sec-meta"><span id="sentScore">—</span><span class="sec-chev">›</span></span>
  </div>
  <div class="sec-body">
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px">X Sentiment</div>
    <div class="sentiment-bar">
      <div class="sent-fill" id="sentFill"></div>
      <div class="sent-mid"></div>
    </div>
    <div class="sent-labels"><span>Bearish</span><span>Neutral</span><span>Bullish</span></div>
    <div id="newsList" style="margin-top:14px"></div>
  </div>
</div>

<!-- BACKTEST -->
<div class="section" id="sec-bt">
  <div class="sec-head" data-toggle="sec-bt">
    <div class="sec-title"><span class="ico">🧪</span>Backtest</div>
    <span class="sec-meta"><span id="btSummary">—</span><span class="sec-chev">›</span></span>
  </div>
  <div class="sec-body">
    <div class="stat-grid" id="btStats"></div>
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px">Equity Curve</div>
    <canvas id="equityChart"></canvas>
  </div>
</div>

<!-- JOURNAL -->
<div class="section" id="sec-journal">
  <div class="sec-head" data-toggle="sec-journal">
    <div class="sec-title"><span class="ico">📓</span>Journal</div>
    <span class="sec-chev">›</span>
  </div>
  <div class="sec-body">
    <div class="journal-list" id="journalList"></div>
    <textarea id="journalInput" placeholder="Notiz hinzufügen…"></textarea>
    <button class="btn btn-secondary" id="addJournalBtn" style="margin-top:8px">+ Eintrag</button>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="nav">
  <div class="nav-inner">
    <button class="nav-btn active" data-scroll="hero"><span class="ico">⚡</span>Live</button>
    <button class="nav-btn" data-scroll="signal"><span class="ico">🎯</span>Signal</button>
    <button class="nav-btn" data-scroll="sec-chart"><span class="ico">📈</span>Chart</button>
    <button class="nav-btn" data-scroll="sec-news"><span class="ico">📰</span>News</button>
    <button class="nav-btn" data-scroll="sec-bt"><span class="ico">🧪</span>BT</button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let currentPrice = null;
let signal = null;
let data = null;
let trade = JSON.parse(localStorage.getItem('mt') || 'null');
let journal = JSON.parse(localStorage.getItem('jr') || '[]');

// ── UTILS ──
const $ = id => document.getElementById(id);
const fmt = (n,d=2) => n==null||isNaN(n) ? '—' : '$'+Number(n).toFixed(d);
const fmtNum = (n,d=2) => n==null||isNaN(n) ? '—' : Number(n).toFixed(d);
const fmtPct = n => n==null||isNaN(n) ? '—' : (n>=0?'+':'')+n.toFixed(2)+'%';
const fmtUsd = n => n==null||isNaN(n) ? '—' : (n>=0?'+$':'-$')+Math.abs(n).toFixed(2);

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200); }

// ── LIVE PRICE (Stooq, 5s) ──
async function fetchLive(){
  try{
    const res = await fetch('https://stooq.com/q/l/?s=cl.f&f=sd2t2ohlcv&h&e=csv',{cache:'no-store'});
    const text = await res.text();
    const cols = text.trim().split('\n')[1].split(',');
    const close = parseFloat(cols[6]), open = parseFloat(cols[3]);
    const high = parseFloat(cols[4]), low = parseFloat(cols[5]);
    if(isNaN(close)) throw 0;
    currentPrice = close;
    const ch = close - open, chPct = (ch/open)*100;
    $('price').textContent = '$'+close.toFixed(2);
    const cEl = $('priceChange');
    cEl.className = 'hero-change ' + (ch>=0?'up':'down');
    cEl.textContent = (ch>=0?'+':'')+ch.toFixed(2)+'  ·  '+fmtPct(chPct);
    $('hero').className = 'hero ' + (ch>=0?'up':'down');
    $('dayHigh').textContent = fmt(high);
    $('dayLow').textContent  = fmt(low);
    $('liveBadge').className = 'live-badge';
    $('liveBadge').innerHTML = '<span class="live-dot"></span>LIVE';
    renderTrade();
  }catch(e){
    $('liveBadge').className = 'live-badge offline';
    $('liveBadge').innerHTML = '<span class="live-dot"></span>OFFLINE';
  }
}
fetchLive(); setInterval(fetchLive, 5000);

// ── SIGNAL ──
async function loadSignal(){

    const r = await fetch('today_signal.json?t='+Date.now());
    signal = await r.json();
    renderSignal();
  }catch(e){ console.warn(e); }
}
loadSignal(); setInterval(loadSignal, 30000);

function renderSignal(){
  if(!signal) return;
  const card = $('signal'), body = $('signalBody'), pill = $('confPill');
  if(signal.status === 'NO_TRADE' || !signal.direction){
    card.className = 'signal no-trade';
    pill.style.display = 'none';
    body.innerHTML = `<div style="text-align:center;padding:24px 0">
      <div class="dir-badge none">⏸ KEIN TRADE</div>
      <div style="margin-top:12px;color:var(--muted);font-size:13px">${signal.reason||''}</div></div>`;
    return;
  }
  card.className = 'signal ' + signal.direction;
  pill.style.display = '';
  const cl = signal.confidence>=75?'high':signal.confidence>=50?'med':'low';
  pill.className = 'conf-pill ' + cl;
  pill.textContent = signal.confidence+'% '+signal.confidence_label;

  const arrow = signal.direction==='long'?'▲':'▼';
  const ez = signal.entry_zone || [signal.entry, signal.entry];
  body.innerHTML = `
    <div style="display:flex;justify-content:center;margin-bottom:18px">
      <div class="dir-badge ${signal.direction}">${arrow} ${signal.direction.toUpperCase()}</div>
    </div>
    <div class="levels">
      <div class="lvl entry full">
        <div class="lvl-lbl"><span class="ico">🎯</span>Entry Zone</div>
        <div class="lvl-val">${fmt(ez[0])} – ${fmt(ez[1])}</div>
      </div>
      <div class="lvl stop">
        <div class="lvl-lbl"><span class="ico">🛑</span>Stop Loss</div>
        <div class="lvl-val">${fmt(signal.stop)}</div>
        <div class="lvl-sub">Risiko: $${signal.risk_usd}</div>
      </div>
      <div class="lvl tp">
        <div class="lvl-lbl"><span class="ico">🟢</span>Target 1</div>
        <div class="lvl-val">${fmt(signal.target1)}</div>
        <div class="lvl-sub">R:R 1:${signal.rr1} · +$${signal.reward1_usd}</div>
      </div>
      <div class="lvl tp full">
        <div class="lvl-lbl"><span class="ico">🟢</span>Target 2</div>
        <div class="lvl-val">${fmt(signal.target2)}</div>
        <div class="lvl-sub">R:R 1:${signal.rr2} · +$${signal.reward2_usd}</div>
      </div>
    </div>
    <div class="reasons">${(signal.reasons||[]).map(r=>`<span class="chip">${r}</span>`).join('')}</div>
  `;
}

// ── KEY LEVELS ──
function renderLevels(){
  const k = data?.keyLevels; if(!k) return;
  const items = [
    ['Pivot', k.pivot], ['VWAP', k.vwap],
    ['R1', k.r1], ['R2', k.r2],
    ['S1', k.s1], ['S2', k.s2],
    ['200 EMA', k.ema200], ['Settlement', k.settlement],
  ];
  $('keyLevels').innerHTML = items.filter(([,v])=>v!=null).map(([l,v])=>`
    <div class="lvl"><div class="lvl-lbl">${l}</div><div class="lvl-val">${fmt(v)}</div></div>
  `).join('');
  $('biasReason').textContent = data.biasReason || '';
}

// ── SESSIONS ──
const sessNames = {premarket:['Pre-Market','🌅'],opening:['Opening','🔔'],midday:['Midday','☀️'],closing:['Closing','🌆'],eod:['EOD','🌙']};
let activeSess = null;
function renderSessions(){
  const s = data?.sessions; if(!s) return;
  const order = ['premarket','opening','midday','closing','eod'];
  const row = order.map(k=>{
    const ss = s[k]; const cls = ss.status==='active'?'active':ss.status==='complete'?'complete':'';
    return `<div class="sess ${cls}" data-sess="${k}">
      <div class="sess-ico">${sessNames[k][1]}</div>
      <div class="sess-lbl">${sessNames[k][0]}</div>
    </div>`;
  }).join('');
  $('sessionsRow').innerHTML = row;
  document.querySelectorAll('.sess').forEach(el=>el.addEventListener('click',()=>showSess(el.dataset.sess)));
  const active = order.find(k=>s[k].status==='active') || order.find(k=>s[k].status!=='complete') || 'eod';
  $('sessionStatus').textContent = sessNames[active][0];
  if(!activeSess) activeSess = active;
  showSess(activeSess);
}
function showSess(key){
  activeSess = key;
  document.querySelectorAll('.sess').forEach(e=>e.style.opacity = e.dataset.sess===key?'1':'0.5');
  const ss = data.sessions[key]; if(!ss) return;
  let html = `<div style="font-weight:600;font-size:14px;margin-bottom:6px">${sessNames[key][1]} ${sessNames[key][0]}</div>`;
  if(ss.summary) html += `<div style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px">${ss.summary}</div>`;
  if(ss.checks){
    html += '<div class="checks">';
    ss.checks.forEach((c,i)=>{
      html += `<label class="check ${c.done?'done':''}"><input type="checkbox" ${c.done?'checked':''} disabled><span>${c.label}</span></label>`;
    });
    html += '</div>';
  }
  $('sessionDetail').innerHTML = html;
}

async function loadBT(){

function renderBT(bt){
  const d = bt.default_strategy; if(!d) return;
  $('btSummary').textContent = `${d.win_rate}% · $${d.total_pnl}`;
  $('btStats').innerHTML = `
    <div class="stat"><div class="stat-lbl">Win Rate</div><div class="stat-val">${d.win_rate}%</div></div>
    <div class="stat"><div class="stat-lbl">PnL</div><div class="stat-val ${d.total_pnl>=0?'up':'down'}">$${d.total_pnl}</div></div>
    <div class="stat"><div class="stat-lbl">Trades</div><div class="stat-val">${d.total_trades}</div></div>
    <div class="stat"><div class="stat-lbl">Profit Factor</div><div class="stat-val">${d.profit_factor}</div></div>
    <div class="stat"><div class="stat-lbl">Max DD</div><div class="stat-val down">$${d.max_drawdown}</div></div>
    <div class="stat"><div class="stat-lbl">Avg Win</div><div class="stat-val up">$${d.avg_win}</div></div>
  `;
  drawEquity(d.equity_curve||[]);
}

function drawEquity(curve){
  const c = $('equityChart'); if(!c||!curve.length) return;
  const dpr = window.devicePixelRatio||1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w*dpr; c.height = h*dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const vals = curve.map(p=>p.equity);
  const min = Math.min(0,...vals), max = Math.max(0,...vals);
  const px = i => (i/(curve.length-1))*w;
  const py = v => h - ((v-min)/(max-min||1))*(h-12) - 6;
  // gradient fill
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(48,209,88,.25)'); grad.addColorStop(1,'rgba(48,209,88,0)');
  ctx.beginPath();
  ctx.moveTo(px(0),h);
  curve.forEach((p,i)=>ctx.lineTo(px(i),py(p.equity)));
  ctx.lineTo(px(curve.length-1),h); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // line
  ctx.beginPath();
  curve.forEach((p,i)=>{ const x=px(i),y=py(p.equity); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle = '#30d158'; ctx.lineWidth = 2; ctx.stroke();
  // zero line
  if(min<0){ ctx.beginPath(); ctx.moveTo(0,py(0)); ctx.lineTo(w,py(0)); ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.lineWidth=1; ctx.stroke(); }
}

// ── MY TRADE ──
function renderTrade(){
  const body = $('myTradeBody');
  if(!trade){
    body.innerHTML = '<div class="mt-empty">Kein offener Trade — trage unten Entry & Größe ein.</div>';
    return;
  }
  $('mtDir').value = trade.dir;
  $('mtEntry').value = trade.entry;
  $('mtQty').value = trade.qty;
  if(currentPrice==null){
    body.innerHTML = `<div class="mt-empty">Warte auf Live-Preis…</div>`;
    return;
  }
  const pts = trade.dir==='long' ? (currentPrice-trade.entry) : (trade.entry-currentPrice);
  const pnl = pts * 100 * trade.qty; // MCL = $100/pt
  const pctMove = (pts/trade.entry)*100;
  const cls = pnl>0.01?'up':pnl<-0.01?'down':'flat';
  body.innerHTML = `
    <div class="mt-pnl ${cls}">${fmtUsd(pnl)}</div>
    <div class="mt-pnl-sub">${pts>=0?'+':''}${pts.toFixed(2)} pts · ${fmtPct(pctMove)} · ${trade.qty} ×</div>
    <div class="mt-bar">
      <span>Entry<b>${fmt(trade.entry)}</b></span>
      <span>Now<b>${fmt(currentPrice)}</b></span>
      <span>Richtung<b style="color:var(--${trade.dir==='long'?'green':'red'})">${trade.dir.toUpperCase()}</b></span>
    </div>
  `;
}

$('saveTradeBtn').addEventListener('click',()=>{
  const dir=$('mtDir').value, entry=parseFloat($('mtEntry').value), qty=parseInt($('mtQty').value)||1;
  if(!entry){ toast('Entry fehlt'); return; }
  trade = {dir,entry,qty,opened:Date.now()};
  localStorage.setItem('mt',JSON.stringify(trade));
  renderTrade(); toast('Trade gespeichert');
});
$('clearTradeBtn').addEventListener('click',()=>{
  trade = null; localStorage.removeItem('mt');
  $('mtEntry').value=''; renderTrade(); toast('Trade gelöscht');
});
$('useSignalBtn').addEventListener('click',()=>{
  if(!signal||!signal.direction){ toast('Kein Signal verfügbar'); return; }
  $('mtDir').value = signal.direction;
  $('mtEntry').value = signal.entry;
  toast('Signal übernommen');
});

// ── JOURNAL ──
function renderJournal(){
  const list = $('journalList');
  if(!journal.length){ list.innerHTML = '<div class="journal-empty">Noch keine Notizen</div>'; return; }
  list.innerHTML = journal.slice().reverse().map(j=>`
    <div class="journal-entry">
      <div class="je-head"><span>${new Date(j.t).toLocaleString('de-CH')}</span><span style="color:var(--red);cursor:pointer" data-del="${j.t}">✕</span></div>
      <div class="je-text">${j.text}</div>
    </div>
  `).join('');
  list.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{
    journal = journal.filter(x=>x.t!=el.dataset.del);
    localStorage.setItem('jr',JSON.stringify(journal));
    renderJournal();
  }));
}
$('addJournalBtn').addEventListener('click',()=>{
  const v = $('journalInput').value.trim(); if(!v) return;
  journal.push({t:Date.now(),text:v});
  localStorage.setItem('jr',JSON.stringify(journal));
  $('journalInput').value=''; renderJournal(); toast('Eintrag gespeichert');
});
renderJournal();
renderTrade();
